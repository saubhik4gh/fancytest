name: Pull logs, convert to Markdown, create PR

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    # -------------------------------
    # Checkout Account-2 repo
    # -------------------------------
    - name: Checkout destination repo
      uses: actions/checkout@v4

    # -------------------------------
    # SSH for Account-1 (read-only)
    # -------------------------------
    - name: Setup SSH for source repo
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SOURCE_SSH_KEY }}" > ~/.ssh/id_source
        chmod 600 ~/.ssh/id_source

        cat <<EOF > ~/.ssh/config
        Host github-source
          HostName github.com
          User git
          IdentityFile ~/.ssh/id_source
          IdentitiesOnly yes
        EOF

        ssh-keyscan github.com >> ~/.ssh/known_hosts

    # -------------------------------
    # Clone source repo TEMPORARILY
    # -------------------------------
    - name: Clone source repo
      run: |
        git clone --depth=1 https://github.com/saubhikdattagithub/mygardenimage.git /tmp/source-repo

    # -------------------------------
    # Convert raw logs → Markdown
    # -------------------------------
    - name: Generate Azure markdown for AMD
      run: |
        AZURE_LOG_AMD=$(find /tmp/source-repo/pytest/test-data-gl \
          -type f -iname "azure-gardener_prod-amd64*platform.test.log" | head -n 1)
    
        [ -n "$AZURE_LOG_AMD" ] || { echo "Azure log AMD not found"; exit 1; }
    
        python3 scripts/log_to_md.py \
          "$AZURE_LOG_AMD" \
          /tmp/1877.0.azure-amd64.md \
          Azure

    - name: Generate Azure markdown for ARM
      run: |
        AZURE_LOG_ARM=$(find /tmp/source-repo/pytest/test-data-gl \
          -type f -iname "azure-gardener_prod-arm64*platform.test.log" | head -n 1)
    
        [ -n "$AZURE_LOG_ARM" ] || { echo "Azure log ARM not found"; exit 1; }
    
        python3 scripts/log_to_md.py \
          "$AZURE_LOG_ARM" \
          /tmp/1877.0.azure-arm64.md \
          Azure

    - name: Generate AWS markdown for AMD
      run: |
        AWS_LOG_AMD=$(find /tmp/source-repo/pytest/test-data-gl \
          -type f -iname "aws-gardener_prod-amd64*platform.test.log" | head -n 1)
    
        [ -n "$AWS_LOG_AMD" ] || { echo "AWS log AMD not found"; exit 1; }
    
        python3 scripts/log_to_md.py \
          "$AWS_LOG_AMD" \
          /tmp/1877.0.aws-amd64.md \
          AWS

    - name: Generate AWS markdown for ARM
      run: |
        AWS_LOG_ARM=$(find /tmp/source-repo/pytest/test-data-gl \
          -type f -iname "aws-gardener_prod-arm64*platform.test.log" | head -n 1)
    
        [ -n "$AWS_LOG_ARM" ] || { echo "AWS log ARM not found"; exit 1; }
    
        python3 scripts/log_to_md.py \
          "$AWS_LOG_ARM" \
          /tmp/1877.0.aws-arm64.md \
          AWS

    - name: Generate GCP markdown for AMD
      run: |
        GCP_LOG_AMD=$(find /tmp/source-repo/pytest/test-data-gl \
          -type f -iname "gcp-gardener_prod-amd64*platform.test.log" | head -n 1)
    
        [ -n "$GCP_LOG_AMD" ] || { echo "GCP log AMD not found"; exit 1; }
    
        python3 scripts/log_to_md.py \
          "$GCP_LOG_AMD" \
          /tmp/1877.0.gcp-amd64.md \
          GCP

    - name: Generate GCP markdown for ARM
      run: |
        GCP_LOG_ARM=$(find /tmp/source-repo/pytest/test-data-gl \
          -type f -iname "gcp-gardener_prod-arm64*platform.test.log" | head -n 1)
    
        [ -n "$GCP_LOG_ARM" ] || { echo "GCP log ARM not found"; exit 1; }
    
        python3 scripts/log_to_md.py \
          "$GCP_LOG_ARM" \
          /tmp/1877.0.gcp-arm64.md \
          GCP





    # -------------------------------
    # Verify generated content
    # -------------------------------
    - name: Verify Markdown
      run: |
        test -f generated/sample.md
        grep -q "v1877.0" generated/sample.md

    # -------------------------------
    # Cleanup raw files
    # -------------------------------
    - name: Cleanup source files
      run: rm -rf /tmp/source-repo

    # -------------------------------
    # Commit & push branch
    # -------------------------------
    - name: Commit and push branch
      id: push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        BRANCH="sync-${GITHUB_RUN_ID}"
        echo "branch=$BRANCH" >> $GITHUB_OUTPUT

        git checkout -b "$BRANCH"
        git add generated/
        git commit -m "Generate Markdown from source logs"
        git push origin "$BRANCH"

    # -------------------------------
    # Create PR in Account-2
    # -------------------------------
    - name: Create Pull Request
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.DEST_REPO_TOKEN }}
        script: |
          const branch = '${{ steps.push.outputs.branch }}'

          const pr = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Sync logs from source repository',
            head: branch,
            base: 'main',
            body: `
            This PR was automatically generated.

            ✔ Pulled raw logs from Account-1
            ✔ Converted to Markdown in Account-2
            ✔ Raw files not committed
            ✔ Verification passed
            `
          })

          core.info(`PR created: ${pr.data.html_url}`)
